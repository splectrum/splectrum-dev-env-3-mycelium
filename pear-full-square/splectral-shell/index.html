<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splectral</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --line: #d8d8d2; --panel: #ffffff; --accent: #2a6f97; --ok: #2d7d46; --warn: #b26b00; --gone: #9a9a94; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ececea; --muted: #a0a09a; --line: #34342f; --panel: #1f1f1d; --accent: #6fb3d8; --ok: #6cc28a; --warn: #e0a24a; --gone: #6a6a65; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
  header .meta { color: var(--muted); font-size: 13px; }
  .layout { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 50px); }
  nav { border-right: 1px solid var(--line); padding: 8px; }
  nav a { display: block; padding: 6px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 14px; overflow-wrap: anywhere; }
  nav a.on { background: var(--panel); outline: 1px solid var(--line); }
  main { padding: 16px; overflow: auto; min-width: 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 12px; }
  .tab { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 13px; }
  .tab.on { background: var(--panel); }
  .tab.beside { border-color: var(--accent); }
  .tab a { color: var(--fg); text-decoration: none; padding: 4px 8px; }
  .tab button { border: 0; background: none; padding: 2px 6px; color: var(--muted); }
  .panes.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .pane { min-width: 0; }
  @media (max-width: 1000px) { .panes.two { grid-template-columns: 1fr; } }
  @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } nav { border-right: 0; border-bottom: 1px solid var(--line); } }
  .muted { color: var(--muted); }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
</style>
<script src="/vendor/react.js"></script>
<script src="/vendor/react-dom.js"></script>
<script src="/vendor/htm.js"></script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/m/splectral-shell/app.js"></script>
</body>
</html>
